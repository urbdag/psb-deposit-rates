name: Daily rate ingestion

on:
  schedule:
    # 02:30 UTC daily ≈ 08:00 IST, after banks publish overnight revisions.
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install TypeScript
        run: npm install -g typescript

      - name: Compile (adapters + ingest deps)
        run: tsc -p tsconfig.json

      - name: Test adapter parsers
        run: node scripts/test-adapters.mjs

      - name: Install Playwright + Chromium (for JS-rendered bank pages)
        run: |
          npm install playwright@1.48.0
          npx playwright install --with-deps chromium

      - name: Install pdf-parse (for PDF rate cards)
        run: npm install pdf-parse@1.1.1

      - name: Run ingestion (adapters -> validate -> dataset.json)
        run: node scripts/ingest.mjs

      - name: Commit refreshed data + history if changed
        run: |
          if git diff --quiet -- public/data/dataset.json public/data/history.json; then
            echo "No rate changes today."
            exit 0
          fi
          git config user.name "rate-bot"
          git config user.email "rate-bot@users.noreply.github.com"
          git add public/data/dataset.json public/data/history.json
          git commit -m "data: daily rate refresh ($(date -u +%Y-%m-%d))"
          git push
          # Pushing to main triggers the deploy workflow, publishing the update.
