name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install TypeScript
        run: npm install -g typescript

      - name: Build (compile TS only)
        # NOTE: we do NOT regenerate public/data/dataset.json here. The committed
        # dataset.json is the source of truth for what's published (it holds the
        # real imported / daily-ingested rates). Regenerating would overwrite it
        # with the sample seed. Use `npm run data` locally only to (re)create the
        # SAMPLE dataset from scratch.
        run: tsc -p tsconfig.json

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # The site lives in public/ — publish that directory.
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
